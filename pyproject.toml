[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qwalk"
version = "0.1.0"
description = "Discrete-time quantum walk as a feature expansion for binary classification"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
notebook = ["jupyter>=1.0", "nbconvert>=7.0"]

[tool.setuptools.packages.find]
include = ["qw*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
